<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="PaperTrail logo">
  <defs>
    <linearGradient id="paperG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceae2"/>
    </linearGradient>
    <linearGradient id="accentG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b4531a"/>
      <stop offset="1" stop-color="#9a4316"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="48" fill="#1c1a14"/>

  <!-- paper, tilted -->
  <g transform="translate(60 42) rotate(-6 70 90)">
    <rect width="140" height="180" rx="6" fill="url(#paperG)"/>
    <!-- text lines -->
    <g stroke="#d8d5c6" stroke-width="3" stroke-linecap="round">
      <line x1="20" y1="34" x2="106" y2="34"/>
      <line x1="20" y1="52" x2="120" y2="52"/>
      <line x1="20" y1="70" x2="90" y2="70"/>
      <line x1="20" y1="94" x2="116" y2="94"/>
      <line x1="20" y1="112" x2="98" y2="112"/>
    </g>
  </g>

  <!-- citation trail overlay -->
  <g>
    <line x1="56" y1="200" x2="104" y2="156" stroke="url(#accentG)" stroke-width="2.5" opacity="0.6"/>
    <line x1="104" y1="156" x2="150" y2="118" stroke="url(#accentG)" stroke-width="2.5" opacity="0.6"/>
    <line x1="150" y1="118" x2="196" y2="76" stroke="url(#accentG)" stroke-width="2.5" opacity="0.6"/>

    <circle cx="56" cy="200" r="9" fill="url(#accentG)"/>
    <circle cx="104" cy="156" r="7" fill="url(#accentG)"/>
    <circle cx="150" cy="118" r="8" fill="url(#accentG)"/>
    <circle cx="196" cy="76" r="11" fill="url(#accentG)"/>
  </g>
</svg>
